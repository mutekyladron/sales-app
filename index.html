const FB_PROJECT = "secrets-mirabel";

const FB_URL = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents/datos`;

async function fbGet(doc){
  try{
    const r=await fetch(`${FB_URL}/${doc}?key=${FB_KEY}`);
    if(!r.ok)return null;
    const j=await r.json();
    if(!j.fields||!j.fields.lista)return null;
    return JSON.parse(j.fields.lista.stringValue);
  }catch(e){console.warn("fbGet error:",e);return null;}
}

async function fbSet(doc,data){
  try{
    const body={fields:{lista:{stringValue:JSON.stringify(data)}}};
    await fetch(`${FB_URL}/${doc}?key=${FB_KEY}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
  }catch(e){console.warn("fbSet error:",e);}
}

async function guardarEnFirebase(){
  try{
    const usersParaFirebase=users.map(u=>({...u,foto:null}));
    await fbSet("users",usersParaFirebase);
    await fbSet("ventas",ventas);
    await fbSet("zonas",zonas);
    await fbSet("linea",lineaData);
    await fbSet("tours",toursData);
  }catch(e){console.warn("Error Firebase:",e);}
}

// sobreescriben con datos base, sin importar que archivo se descargue.
async function cargarDesdeFirebase(){
  try{
    const fu=await fbGet("users");
    const fv=await fbGet("ventas");
    const fz=await fbGet("zonas");

    // USUARIOS: Firebase manda siempre que tenga datos reales
    if(fu&&fu.length>0){
      // Preservar fotos locales (no se guardan en Firebase)
      fu.forEach(u=>{
        const local=users.find(l=>l.id===u.id);
        if(local&&local.foto)u.foto=local.foto;
      });
      users=fu;
      try{localStorage.setItem("smirabel_users",JSON.stringify(users));}catch(e){}
    } else {
      // Firebase vacio — subir datos actuales para que queden guardados
      // Esto solo pasa la primera vez que se usa la app
      await guardarEnFirebase();
    }

    // VENTAS: Firebase manda siempre
    if(fv&&fv.length>=0){
      ventas=fv;
      try{localStorage.setItem("smirabel_ventas",JSON.stringify(ventas));}catch(e){}
    }

    // ZONAS: Firebase manda siempre
    if(fz&&Object.keys(fz).length>0){
      zonas=fz;
      try{localStorage.setItem("smirabel_zonas",JSON.stringify(zonas));}catch(e){}

      lineaData=fl;
      try{localStorage.setItem("smirabel_linea",JSON.stringify(lineaData));}catch(e){}
    }

  }catch(e){
    console.warn("Firebase no disponible, usando datos locales:",e);
    // Sin internet: usar lo que hay en localStorage (ya cargado antes)
  }
  // Actualizar login con datos reales
  renderLogin();
}

window.loginPinKey=k=>{
  if(k==="←"){LOGIN.pinBuffer=LOGIN.pinBuffer.slice(0,-1);LOGIN.pinError="";renderLogin();return;}
  if(k==="OK"||LOGIN.pinBuffer.length>=4){
    const pin=k==="OK"?LOGIN.pinBuffer:LOGIN.pinBuffer+k;
    const u=users.find(u=>u.id===LOGIN.selUserId);
    if(u&&u.pin===pin){LOGIN.activo=true;LOGIN.userId=u.id;S.cuIdx=users.findIndex(u=>u.id===LOGIN.userId);iniciarSincronizacion();render();}
    else{LOGIN.pinError="PIN incorrecto";LOGIN.pinBuffer="";renderLogin();}
    return;
  }
  LOGIN.pinBuffer+=String(k);
  if(LOGIN.pinBuffer.length===4){
    const u=users.find(u=>u.id===LOGIN.selUserId);
    if(u&&u.pin===LOGIN.pinBuffer){LOGIN.activo=true;LOGIN.userId=u.id;S.cuIdx=users.findIndex(u=>u.id===LOGIN.userId);iniciarSincronizacion();render();}

    return;
  }
  renderLogin();
};

// ── STATUS DEL DÍA para un usuario ────────────────────────────────────────
function statusDia(u, fechaStr){
  if(!fechaStr)fechaStr=todayStr();
  const d=new Date(fechaStr+"T12:00:00");
  const diaSem=d.getDay(); // 0=Dom
  // 1. Vacaciones
  const enVac=(u.vacaciones||[]).some(v=>{
    const desde=new Date(v.desde+"T00:00:00"),hasta=new Date(v.hasta+"T23:59:59");
    return d>=desde&&d<=hasta;
  });
  if(enVac)return{status:"Vacaciones",detalle:""};
  // 2. Permiso/Falta/Castigo registrado para esa fecha
  const perm=(u.permisos||[]).find(p=>p.fecha===fechaStr);
  if(perm)return{status:perm.tipo,detalle:perm.nota,castigos:perm.castigos||0};
  // 3. Day Off (día de la semana)
  if((u.dayOff||[]).includes(diaSem))return{status:"Day Off",detalle:DIAS_SEM[diaSem]};
  return{status:"Activo",detalle:""};
}
// ¿Trabaja hoy?
function trabajaHoy(u,fechaStr){
  const s=statusDia(u,fechaStr);
  return s.status==="Activo";
}

// ── CALENDARIO ────────────────────────────────────────────────────────────
function renderCalendario(){
  const yr=S.calYr,mo=S.calMo;
  const diasM=new Date(yr,mo+1,0).getDate(),pd=new Date(yr,mo,1).getDay();
  const keyOf=d=>`${yr}-${PAD(mo+1)}-${PAD(d)}`;
  const vDia=d=>{const vs=ventas.filter(v=>v.fecha===keyOf(d));return isRep()?vs.filter(v=>v.rep_id===cu().id):vs;};
  const colDia=d=>{
  const a=vDia(d).filter(v=>!v.cancelado&&v.tipo!=="Cancelacion");
  const cx=vDia(d).filter(v=>v.tipo==="Cancelacion");
  const hasTour=toursData[keyOf(d)]&&toursData[keyOf(d)][cu().id];
  const sd=statusDia(cu(),keyOf(d));
  if(a.length&&cx.length)return C.gold;
  if(cx.length)return C.red;
  if(a.some(v=>v.tipo==="Socio/Upgrade"))return C.pur;
  if(a.some(v=>v.tipo==="Agencia"))return C.acc;
  if(hasTour)return C.blue;
  if(sd.status!=="Activo")return C.mut;
  return null;
};
  const selV=S.calSel?vDia(S.calSel):[];
  const anios=[];for(let y=2025;y<=hoy.getFullYear()+1;y++)anios.push(y);
  return`<div style="padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button onclick="navMo(-1)" style="background:${C.surf};border:1px solid ${C.brd};color:${C.txt};border-radius:8px;padding:6px 16px;font-size:16px">&#8249;</button>
      <div style="font-size:14px;font-weight:900">${MESES[mo]} ${yr}</div>
      <button onclick="navMo(1)" style="background:${C.surf};border:1px solid ${C.brd};color:${C.txt};border-radius:8px;padding:6px 16px;font-size:16px">&#8250;</button>
    </div>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:10px;flex-wrap:wrap">
      ${anios.map(y=>`<button onclick="S.calYr=${y};S.calSel=null;render()" style="background:${yr===y?C.acc:C.surf};color:${yr===y?"#071020":C.mut};border:1px solid ${yr===y?C.acc:C.brd};border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800">${y}</button>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px">
      ${["D","L","M","X","J","V","S"].map(d=>`<div style="text-align:center;font-size:10px;color:${C.mut};font-weight:800">${d}</div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px">
      ${Array(pd).fill("").map(()=>`<div></div>`).join("")}
      ${Array(diasM).fill("").map((_,i)=>{
        const d=i+1,c=colDia(d);
        const isH=d===hoy.getDate()&&mo===hoy.getMonth()&&yr===hoy.getFullYear();
        const isSel=d===S.calSel;
        return`<div onclick="S.calSel=S.calSel===${d}?null:${d};render()" style="aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:${isSel?C.acc+"30":c?c+"18":C.surf};border:1.5px solid ${isSel?C.acc:isH?C.gold:c||C.brd}">
          <span style="font-size:11px;font-weight:${isH?900:500};color:${c||(isH?C.gold:C.txt)}">${d}</span>
          <div style="display:flex;gap:2px;margin-top:2px;justify-content:center">
            ${vDia(d).length>0?`<div style="width:4px;height:4px;border-radius:50%;background:${c||C.acc}"></div>`:""}
            ${(toursData[keyOf(d)]&&toursData[keyOf(d)][cu().id]&&vDia(d).length===0)?`<div style="width:4px;height:4px;border-radius:50%;background:${C.blue}"></div>`:""}
            ${(statusDia(cu(),keyOf(d)).status!=="Activo"&&vDia(d).length===0)?`<div style="width:4px;height:4px;border-radius:50%;background:${C.mut}"></div>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>
    ${S.calSel?card(`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:900">${keyOf(S.calSel)}</div>
        <div style="display:flex;gap:6px">
          <button onclick="openTourModal('${keyOf(S.calSel)}')" style="background:${C.blue}22;color:${C.blue};border:1px solid ${C.blue}44;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:800">Tour</button>
          ${isMgr()||cu().rol==="Cerrador"?`<button onclick="openCxl('${keyOf(S.calSel)}')" style="background:${C.red}22;color:${C.red};border:1px solid ${C.red}44;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:800">Cancelacion</button>`:""}
          <button onclick="openVenta('${keyOf(S.calSel)}')" style="background:${C.acc};color:#071020;border:none;border-radius:8px;padding:6px 10px;font-size:10px;font-weight:800">Venta</button>
        </div>
      </div>
      ${(()=>{
        const sd=statusDia(cu(),keyOf(S.calSel));
        const tours=toursData[keyOf(S.calSel)]&&toursData[keyOf(S.calSel)][cu().id];
        const statusHTML=sd.status!=="Activo"?`<div style="background:${stC(sd.status)}22;border:1px solid ${stC(sd.status)}44;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="font-size:18px">${sd.status==="Day Off"?"🏖️":sd.status==="Vacaciones"?"✈️":sd.status==="Permiso"?"📋":"🤒"}</span><div><div style="font-size:13px;font-weight:800;color:${stC(sd.status)}">${sd.status}</div>${sd.detalle?`<div style="font-size:10px;color:${C.mut}">${sd.detalle}</div>`:""}</div></div>`:"";
        const toursHTML=tours?`<div style="background:${C.blue}15;border:1px solid ${C.blue}33;border-radius:10px;padding:10px;margin-bottom:10px"><div style="font-size:10px;color:${C.blue};font-weight:800;margin-bottom:6px">TOURS DEL DIA</div><div style="display:flex;gap:10px">${tours.qs>0?`<div style="text-align:center;background:${C.acc}15;border-radius:8px;padding:8px 16px"><div style="font-size:18px;font-weight:900;color:${C.acc}">${tours.qs}</div><div style="font-size:9px;color:${C.mut}">Q's</div></div>`:""} ${tours.cts>0?`<div style="text-align:center;background:${C.mut}15;border-radius:8px;padding:8px 16px"><div style="font-size:18px;font-weight:900;color:${C.mut}">${tours.cts}</div><div style="font-size:9px;color:${C.mut}">CT's</div></div>`:""}</div></div>`:"";
        return statusHTML+toursHTML;
      })()}
      ${selV.length===0?`<div style="color:${C.mut};font-size:13px">Sin ventas este dia</div>`:selV.map(v=>{
        const c=v.tipo==="Cancelacion"?C.red:v.cancelado?C.mut:v.tipo==="Socio/Upgrade"?C.pur:C.acc;
        return`<div style="border-left:3px solid ${c};padding-left:10px;margin-bottom:10px;opacity:${v.cancelado?0.5:1}">
          ${tag(v.cancelado?"CANCELADA":v.tipo,c)}${tag(v.mem,C.blue)}${tag(v.loc,C.mut)}
          <div style="font-size:18px;font-weight:900;color:${c};margin-top:4px">${FMT(v.vol)}</div>
          <div style="font-size:11px;color:${C.mut};margin-top:2px">${v.cliente} — ${getName(v.rep_id)}</div>
          ${v.eng>0?`<div style="font-size:11px;color:${C.gold}">Eng: ${FMT(v.eng)} (${v.pctEng}%)</div>`:""}
          ${v.premiere>0?`<div style="font-size:10px;color:${C.pur}">Prem: ${v.premiere}sem · TQ: ${v.turquia} · FB: ${v.flybacks}</div>`:""}
        </div>`;}).join("")}`):""}
  </div>`;
}

// ── DETALLE USUARIO ───────────────────────────────────────────────────────
function renderDetalle(){
  const u=users.find(u=>u.id===S.detalleId);

  const vm=filtMes(ventas,mo,yr);
  const campo=u.rol==="Vendedor"?"rep_id":"cerr_id";

  const permMes=(u.permisos||[]).filter(p=>{const d=new Date(p.fecha+"T12:00:00");return d.getMonth()===mo&&d.getFullYear()===yr;});

  const permisos=permMes.filter(p=>p.tipo==="Permiso").length;

        <div style="margin-top:4px">${tag(u.rol,rolC(u.rol))}${tag(u.posicion,posC(u.posicion))}${u.zona?tag(u.zona,C.pur):""}${u.hotel?tag(u.hotel,C.blue):""}</div>
        <div style="margin-top:4px">${tag(sd.status,stC(sd.status))}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">
      ${[["Vol Mes",FMTK(volM),C.acc],["Ventas",vtasM,C.txt],["Faltas",faltas,C.red],["Castigos",castigos,C.ora]].map(([l,v,c])=>`<div style="background:${C.card};border-radius:10px;padding:8px 4px;text-align:center"><div style="font-size:13px;font-weight:900;color:${c}">${v}</div><div style="font-size:8px;color:${C.mut}">${l} ${l==="Faltas"||l==="Castigos"?"(mes)":""}</div></div>`).join("")}
    </div>
    <!-- TABS del detalle -->
    <div style="display:flex;gap:4px;margin-bottom:12px;overflow-x:auto">
      ${[["info","Datos"],["stats","Estadisticas"],["dayoff","Day Off"],["vac","Vacaciones"],["perm","Permisos/Faltas"],["zona","Zona"],["pos","Posicion"]].map(([id,lb])=>`<button onclick="S.detTab='${id}';render()" style="padding:6px 10px;border-radius:20px;border:1px solid ${dt===id?C.acc:C.brd};background:${dt===id?C.acc+"22":"transparent"};color:${dt===id?C.acc:C.mut};font-size:10px;font-weight:800;white-space:nowrap">${lb}</button>`).join("")}
    </div>

    ${dt==="info"?`
      <div style="background:${C.surf};border-radius:12px;overflow:hidden;margin-bottom:14px">
        <div style="position:relative;height:110px;background:linear-gradient(135deg,${C.acc}22,${C.pur}22);display:flex;align-items:center;justify-content:center">
          ${u.foto
            ?`<div style="position:relative"><img src="${u.foto}" style="width:80px;height:80px;border-radius:50%;border:3px solid ${rolC(u.rol)};object-fit:cover"><label for="fotoInput_${u.id}" style="position:absolute;bottom:0;right:0;background:${C.acc};border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px">&#9998;</label></div>`
            :`<label for="fotoInput_${u.id}" style="width:80px;height:80px;border-radius:50%;border:3px dashed ${rolC(u.rol)};display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:${rolC(u.rol)}11">
                <span style="font-size:26px">&#128247;</span>
                <span style="font-size:9px;color:${C.mut};margin-top:2px">Subir foto</span>
              </label>`}

        </div>
      </div>
      ${isMgr()?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">
          <div>${lbl("Nombre")}<input id="inf_nom" value="${u.nombre||''}" placeholder="Nombre" onchange="upInfo(${u.id},'nombre',this.value)"></div>
          <div>${lbl("Apellido")}<input id="inf_ape" value="${u.apellido||''}" placeholder="Apellido" onchange="upInfo(${u.id},'apellido',this.value)"></div>
          <div>${lbl("Fecha de nacimiento")}<input id="inf_nac" type="date" value="${u.nacimiento||''}" onchange="upInfo(${u.id},'nacimiento',this.value)"></div>
          <div>${lbl("Celular")}<input id="inf_cel" type="tel" value="${u.cel||''}" placeholder="+52 000 000 0000" onchange="upInfo(${u.id},'cel',this.value)"></div>
          <div style="grid-column:span 2">${lbl("Correo electronico")}<input id="inf_email" type="email" value="${u.email||''}" placeholder="correo@email.com" onchange="upInfo(${u.id},'email',this.value)"></div>
          <div style="grid-column:span 2">${lbl("Posicion en la empresa")}<input value="${u.posicion}" disabled style="opacity:0.5"></div>
        </div>
        <div style="background:${C.acc}15;border:1px solid ${C.acc}33;border-radius:8px;padding:8px 12px;font-size:10px;color:${C.acc};margin-top:4px">Los cambios se guardan automaticamente al escribir.</div>
      `:`
        <div style="background:${C.surf};border-radius:12px;padding:16px;margin-bottom:10px">
          ${u.foto?"":`<div style="text-align:center;margin-bottom:14px"><label for="fotoInput_${u.id}" style="display:inline-flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer"><span style="font-size:32px">&#128247;</span><span style="font-size:11px;color:${C.acc};font-weight:800">Subir mi foto</span></label><input type="file" id="fotoInput_${u.id}" accept="image/*" style="display:none" onchange="subirFoto(${u.id},this)"></div>`}
          ${[[u.nombre||"--","Nombre"],[u.apellido||"--","Apellido"],[u.nacimiento||"--","Nacimiento"],[u.cel||"--","Celular"],[u.email||"--","Email"],[u.posicion,"Posicion"]].map(([v,l])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid ${C.brd}"><span style="font-size:11px;color:${C.mut};font-weight:800">${l}</span><span style="font-size:12px;font-weight:700">${v}</span></div>`).join("")}
        </div>
      `}
    `:""}

    ${dt==="stats"?`
      <div style="font-size:10px;color:${C.mut};font-weight:800;margin-bottom:8px">VENTAS DEL MES</div>
      ${isMgr()?`<div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="openVentaU(${u.id})" style="flex:1;background:${C.acc};color:#071020;border:none;border-radius:8px;padding:8px;font-size:11px;font-weight:800">+ Venta</button>
        <button onclick="openCxlDet()" style="flex:1;background:${C.red}22;color:${C.red};border:1px solid ${C.red}44;border-radius:8px;padding:8px;font-size:11px;font-weight:800">Cancelar venta</button>
      </div>`:""}
      ${(()=>{
        // Tours del mes para este usuario
        const mesStr=String(hoy.getFullYear())+"-"+String(hoy.getMonth()+1).padStart(2,"0");
        let qsTotMes=0,ctsTotMes=0,qsTotAnio=0,ctsTotAnio=0;
        const anioStr=String(hoy.getFullYear());
        Object.entries(toursData).forEach(([fecha,uData])=>{
          const d=uData[u.id];if(!d)return;
          if(fecha.startsWith(mesStr)){qsTotMes+=d.qs||0;ctsTotMes+=d.cts||0;}
          if(fecha.startsWith(anioStr)){qsTotAnio+=d.qs||0;ctsTotAnio+=d.cts||0;}
        });
        // Ventas del mes/año para calculo de cierre
        const vtasMes=vm.filter(v=>v[campo]===u.id&&!v.cancelado&&v.tipo!=="Cancelacion").length;
        const vtasAnio=filtAnio(ventas,hoy.getFullYear()).filter(v=>v[campo]===u.id&&!v.cancelado&&v.tipo!=="Cancelacion").length;
        const pctMes=qsTotMes>0?((vtasMes/qsTotMes)*100).toFixed(1):"0.0";
        const pctAnio=qsTotAnio>0?((vtasAnio/qsTotAnio)*100).toFixed(1):"0.0";
        return qsTotMes+ctsTotMes+qsTotAnio+ctsTotAnio>0?`
          <div style="background:${C.blue}15;border:1px solid ${C.blue}33;border-radius:12px;padding:12px;margin-bottom:10px">
            <div style="font-size:10px;color:${C.blue};font-weight:800;margin-bottom:10px">RECORD DE TOURS</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div style="background:${C.surf};border-radius:10px;padding:10px;text-align:center">

                <div style="display:flex;justify-content:center;gap:10px">
                  <div><div style="font-size:16px;font-weight:900;color:${C.acc}">${qsTotMes}</div><div style="font-size:8px;color:${C.mut}">Q's</div></div>
                  <div><div style="font-size:16px;font-weight:900;color:${C.mut}">${ctsTotMes}</div><div style="font-size:8px;color:${C.mut}">CT's</div></div>
                  <div><div style="font-size:16px;font-weight:900;color:${C.gold}">${pctMes}%</div><div style="font-size:8px;color:${C.mut}">Cierre</div></div>
                </div>
              </div>
              <div style="background:${C.surf};border-radius:10px;padding:10px;text-align:center">
                <div style="font-size:9px;color:${C.mut};font-weight:800;margin-bottom:6px">AÑO</div>
                <div style="display:flex;justify-content:center;gap:10px">
                  <div><div style="font-size:16px;font-weight:900;color:${C.acc}">${qsTotAnio}</div><div style="font-size:8px;color:${C.mut}">Q's</div></div>
                  <div><div style="font-size:16px;font-weight:900;color:${C.mut}">${ctsTotAnio}</div><div style="font-size:8px;color:${C.mut}">CT's</div></div>
                  <div><div style="font-size:16px;font-weight:900;color:${C.gold}">${pctAnio}%</div><div style="font-size:8px;color:${C.mut}">Cierre</div></div>
                </div>
              </div>
            </div>
          </div>`:"";
      })()}
      ${vm.filter(v=>v[campo]===u.id).length===0?`<div style="color:${C.mut};font-size:12px">Sin ventas este mes</div>`:vm.filter(v=>v[campo]===u.id).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(v=>{const c=v.tipo==="Cancelacion"?C.red:v.cancelado?C.mut:v.tipo==="Socio/Upgrade"?C.pur:C.acc;return`<div style="border-left:3px solid ${c};padding-left:10px;margin-bottom:8px;opacity:${v.cancelado?0.5:1}">${tag(v.cancelado?"CANCELADA":v.tipo,c)}${tag(v.mem,C.blue)}<div style="font-size:15px;font-weight:900;color:${c};margin-top:3px">${FMT(v.vol)}</div><div style="font-size:10px;color:${C.mut}">${v.fecha} — ${v.cliente}</div></div>`;}).join("")}
    `:""}

    ${dt==="dayoff"?`

        ${DIAS_SEM.map((d,i)=>`<button onclick="toggleDayOff(${u.id},${i})" style="padding:10px 4px;border-radius:10px;border:2px solid ${(u.dayOff||[]).includes(i)?C.pur:C.brd};background:${(u.dayOff||[]).includes(i)?C.pur+"22":C.surf};color:${(u.dayOff||[]).includes(i)?C.pur:C.mut};font-size:11px;font-weight:800;text-align:center">${d}${(u.dayOff||[]).includes(i)?'<br><span style="font-size:8px">Descanso</span>':''}</button>`).join("")}

      <div style="background:${C.surf};border-radius:10px;padding:10px;font-size:11px;color:${C.mut}">
        Dias de descanso: <strong style="color:${C.pur}">${(u.dayOff||[]).length===0?"Ninguno":(u.dayOff||[]).map(i=>DIAS_SEM[i]).join(", ")}</strong>

    `:""}

    ${dt==="vac"?`
      <div style="font-size:12px;color:${C.txt};margin-bottom:10px">Registra periodos de vacaciones. En esas fechas ${u.n.split(" ")[0]} no aparecera en la linea del dia.</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

          <div>${lbl("Hasta")}<input type="date" id="vac_hasta" value="${S.vacHasta}" onchange="S.vacHasta=this.value"></div>

          ${["Permiso","Falta","Castigo/Promo"].map(t=>`<button onclick="S.permTipo='${t}';render()" style="flex:1;background:${S.permTipo===t?stC(t):C.surf};color:${S.permTipo===t?"#071020":C.mut};border:1px solid ${S.permTipo===t?stC(t):C.brd};border-radius:8px;padding:7px 2px;font-size:10px;font-weight:800">${t}</button>`).join("")}

// ── PERFIL ────────────────────────────────────────────────────────────────
// ── LINEA ─────────────────────────────────────────────────────────────────
// lineaData[fecha][userId] = {tomoPareja:bool, vendioVol:number(0=no vendio)}

function getAyer(){
  const d=new Date(hoy);d.setDate(d.getDate()-1);
  return d.toISOString().split("T")[0];
}
function getPAD(n){return String(n).padStart(2,"0");}
function fechaStr(d){return d.getFullYear()+"-"+getPAD(d.getMonth()+1)+"-"+getPAD(d.getDate());}

// Calcula el volumen de agencias del mes actual para un usuario
function volAgMes(uid){
  const mo=hoy.getMonth(),yr=hoy.getFullYear();
  return filtMes(ventas,mo,yr)
    .filter(v=>v.rep_id===uid&&v.tipo==="Agencia"&&!v.cancelado&&v.tipo!=="Cancelacion")
    .reduce((a,v)=>a+v.vol,0);
}
function volAgMesCerr(uid){
  const mo=hoy.getMonth(),yr=hoy.getFullYear();
  return filtMes(ventas,mo,yr)
    .filter(v=>v.cerr_id===uid&&v.tipo==="Agencia"&&!v.cancelado&&v.tipo!=="Cancelacion")
    .reduce((a,v)=>a+v.vol,0);
}

// Volumen vendido ayer por un usuario (solo agencias)
function volAyerRep(uid){
  const ayer=getAyer();
  return ventas
    .filter(v=>v.fecha===ayer&&v.rep_id===uid&&v.tipo==="Agencia"&&!v.cancelado)
    .reduce((a,v)=>a+v.vol,0);
}
function volAyerCerr(uid){
  const ayer=getAyer();
  return ventas
    .filter(v=>v.fecha===ayer&&v.cerr_id===uid&&!v.cancelado&&v.tipo!=="Cancelacion")
    .reduce((a,v)=>a+v.vol,0);
}

// Status de hoy para la linea (trabaja o descansa)
function trabajaHoyLinea(u){
  const sd=statusDia(u,todayStr());
  return sd.status==="Activo";
}
// Descansó ayer
function descansoAyer(u){
  const sd=statusDia(u,getAyer());
  return sd.status!=="Activo";
}

// Semilla determinista por fecha para aleatorio consistente
function seededRandom(seed,index){
  let h=seed*2654435761^(index*2246822519);
  h=((h>>>16)^h)*0x45d9f3b;
  h=((h>>>16)^h)*0x45d9f3b;
  h=(h>>>16)^h;
  return(h>>>0)/4294967296;
}
function shuffleSeeded(arr,dateStr){
  const seed=dateStr.split("-").reduce((a,n)=>a*100+parseInt(n),0);
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(seededRandom(seed,i)*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// REGLA MAESTRA: construir la linea de reps para HOY
function calcularLineaReps(){
  const hoyStr=todayStr();
  const ayerStr=getAyer();
  const diaDelMes=hoy.getDate();
  const reps=users.filter(u=>u.activo&&u.rol==="Vendedor");
  const activos=reps.filter(u=>trabajaHoyLinea(u));
  const descansoHoy=reps.filter(u=>!trabajaHoyLinea(u));

  // Datos de ayer
  const lineaAyer=lineaData[ayerStr]||{};

  // BLOQUE 1: vendieron ayer — mayor a menor volumen agencia
  const vendieronAyer=activos
    .filter(u=>volAyerRep(u.id)>0)
    .sort((a,b)=>volAyerRep(b.id)-volAyerRep(a.id));

  const vendieronIds=new Set(vendieronAyer.map(u=>u.id));
  const restantes=activos.filter(u=>!vendieronIds.has(u.id));

  // BLOQUE 2: descansaron ayer (pero trabajan hoy)
  const descansaronAyer=restantes.filter(u=>descansoAyer(u));
  const descansaronIds=new Set(descansaronAyer.map(u=>u.id));
  const sinDescanso=restantes.filter(u=>!descansaronIds.has(u.id));

  // BLOQUE 3: no tomaron pareja ayer (y no vendieron, y no descansaron)
  const noTomaronPareja=sinDescanso.filter(u=>{
    const d=lineaAyer[u.id];
    return !d||(!d.tomoPareja&&!d.vendioVol);
  });
  const noTomaronIds=new Set(noTomaronPareja.map(u=>u.id));

  // BLOQUE 4+5: tomaron pareja (o sin registro = se asume tomaron)
  const tomaronPareja=sinDescanso.filter(u=>!noTomaronIds.has(u.id));

  let bloqueRotacion;
  if(diaDelMes<=10){
    // Rotación aleatoria diaria (seeded por fecha)
    bloqueRotacion=shuffleSeeded(tomaronPareja,hoyStr);
  } else {
    // Día 11+: por volumen acumulado de agencias
    bloqueRotacion=[...tomaronPareja].sort((a,b)=>volAgMes(b.id)-volAgMes(a.id));
  }

  return{
    vendieron:vendieronAyer,
    descansaronAyer:descansaronAyer,
    noTomaronPareja:noTomaronPareja,
    rotacion:bloqueRotacion,
    descansoHoy:descansoHoy,
    lineaAyer,
    ayerStr
  };
}

// REGLA MAESTRA: construir la linea de cerradores para HOY
function calcularLineaCerr(){
  const hoyStr=todayStr();
  const cerrs=users.filter(u=>u.activo&&(u.rol==="Cerrador"||u.rol==="Manager-Cerrador"));
  const activos=cerrs.filter(u=>trabajaHoyLinea(u));
  const descansoHoy=cerrs.filter(u=>!trabajaHoyLinea(u));

  // BLOQUE 1: vendieron ayer — mayor a menor volumen total
  const vendieronAyer=activos
    .filter(u=>volAyerCerr(u.id)>0)
    .sort((a,b)=>volAyerCerr(b.id)-volAyerCerr(a.id));
  const vendieronIds=new Set(vendieronAyer.map(u=>u.id));

  // Resto: por volumen acumulado de agencias del mes
  const resto=[...activos.filter(u=>!vendieronIds.has(u.id))]
    .sort((a,b)=>volAgMesCerr(b.id)-volAgMesCerr(a.id));

  return{vendieron:vendieronAyer,rotacion:resto,descansoHoy};
}

function renderMVPs(){

  const esMes=S.mvpPeriodo==="mes";

  // Filtrar ventas según periodo
  const arr=esMes?filtMes(ventas,mo,yr):filtAnio(ventas,yr);
  const venAct=arr.filter(v=>!v.cancelado&&v.tipo!=="Cancelacion");

  // Calcular stats de reps
  const reps=users.filter(u=>u.activo&&u.rol==="Vendedor").map(u=>{
    const mis=venAct.filter(v=>v.rep_id===u.id);
    const ag=mis.filter(v=>v.tipo==="Agencia");
    const so=mis.filter(v=>v.tipo==="Socio/Upgrade");
    const vol=mis.reduce((a,v)=>a+v.vol,0);
    const volAg=ag.reduce((a,v)=>a+v.vol,0);
    const qs=mis.reduce((a,v)=>a+(v.qs||0),0);
    const cts=mis.reduce((a,v)=>a+(v.cts||0),0);
    return{...u,vol,volAg,vtas:mis.length,ag:ag.length,so:so.length,qs,cts,pct:qs>0?((cts/qs)*100).toFixed(1):"0.0"};
  }).sort((a,b)=>b.vol-a.vol);

  // Calcular stats de cerradores
  const cerrs=users.filter(u=>u.activo&&(u.rol==="Cerrador"||u.rol==="Manager-Cerrador")).map(u=>{
    const mis=venAct.filter(v=>v.cerr_id===u.id);

    const so=mis.filter(v=>v.tipo==="Socio/Upgrade");

    const qs=mis.reduce((a,v)=>a+(v.qs||0),0);

        ${lista.slice(3).map((u,i)=>`

              <div style="font-size:12px;font-weight:800">${u.n}</div>
              <div style="font-size:9px;color:${posC(u.posicion)}">${u.posicion}</div>

            <div style="font-size:12px;font-weight:900;color:${C.txt}">${FMTK(u.vol)}</div>

  };

  // Colores de medallas
  const goldSilverBronze=[C.gold,"#C0C0C0","#CD7F32"];

  return`<div style="padding:14px">
    <!-- HEADER -->
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:22px;font-weight:900">🏆 MVPs</div>
      <div style="font-size:11px;color:${C.mut}">Top vendedores y cerradores</div>

      <button onclick="S.mvpPeriodo='anio';render()" style="flex:1;background:${!esMes?C.gold:C.surf};color:${!esMes?"#071020":C.mut};border:1px solid ${!esMes?C.gold:C.brd};border-radius:8px;padding:9px;font-size:12px;font-weight:800">Por Año</button>
    </div>

    ${esMes?`
      <!-- SELECTOR AÑO -->
      <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">
        ${anios.map(y=>`<button onclick="S.mvpSelYr=${y};render()" style="background:${yr===y?C.gold:C.surf};color:${yr===y?"#071020":C.mut};border:1px solid ${yr===y?C.gold:C.brd};border-radius:20px;padding:4px 12px;font-size:11px;font-weight:800">${y}</button>`).join("")}
      </div>
      <!-- SELECTOR MES -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:16px">
        ${MESES_C.map((m,i)=>`<button onclick="S.mvpSelMo=${i};render()" style="background:${mo===i?C.acc:C.surf};color:${mo===i?"#071020":C.mut};border:1px solid ${mo===i?C.acc:C.brd};border-radius:8px;padding:7px 2px;font-size:10px;font-weight:800">${m}</button>`).join("")}

      <!-- SELECTOR AÑO ANUAL -->
      <div style="display:flex;gap:6px;margin-bottom:16px">
        ${anios.map(y=>`<button onclick="S.mvpSelYr=${y};render()" style="flex:1;background:${yr===y?C.gold:C.surf};color:${yr===y?"#071020":C.mut};border:1px solid ${yr===y?C.gold:C.brd};border-radius:8px;padding:9px;font-size:13px;font-weight:800">${y}</button>`).join("")}
      </div>

    <!-- PODIO REPS -->
    <div style="background:${C.card};border:1px solid ${C.acc}44;border-radius:16px;padding:14px;margin-bottom:16px">
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:14px;font-weight:900;color:${C.acc}">TOP VENDEDORES</div>
        <div style="font-size:10px;color:${C.mut}">Liner · FTM · FTB — ${esMes?MESES[mo]+" "+yr:"Año "+yr}</div>
      </div>
      ${podio(reps,goldSilverBronze)}
    </div>

    <!-- PODIO CERRADORES -->
    <div style="background:${C.card};border:1px solid ${C.pur}44;border-radius:16px;padding:14px;margin-bottom:16px">
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:14px;font-weight:900;color:${C.pur}">TOP CERRADORES</div>
        <div style="font-size:10px;color:${C.mut}">Cerrador · Manager-Cerrador — ${esMes?MESES[mo]+" "+yr:"Año "+yr}</div>
      </div>
      ${podio(cerrs,goldSilverBronze)}

  </div>`;
}

function renderModal(){

  const reps=users.filter(u=>u.rol==="Vendedor"&&u.activo);
  const cerrs=users.filter(u=>(u.rol==="Cerrador"||u.rol==="Manager-Cerrador")&&u.activo);
  let content="";
  if(S.modal==="venta"){
    const f=S.vf;
    content=`<div style="font-size:14px;font-weight:900;margin-bottom:12px">Nueva Venta — ${f.fecha}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>${lbl("Contrato")}<input id="vf_cont" value="${f.contrato}" placeholder="C-001"></div>

          ${lbl("Locacion")}

        <div style="grid-column:span 2">${lbl("Cliente")}<input id="vf_cli" value="${f.cliente}" placeholder="Nombre del cliente"></div>

        <div>${lbl("Cerrador")}<select id="vf_cerr"><option value="">--</option>${cerrs.map(u=>`<option value="${u.id}" ${f.cerr_id==u.id?"selected":""}>${u.n}</option>`).join("")}</select></div>

      </div>`;}

      <div style="background:${C.surf};border:2px solid ${C.red};border-radius:10px;padding:12px;margin-bottom:12px">

      <div style="display:flex;gap:8px;margin-top:8px">
        <button onclick="S.cxlStep=2;render()" style="flex:1;background:${C.surf};color:${C.mut};border:1px solid ${C.brd};border-radius:8px;padding:9px;font-weight:800">Atras</button>

      </div>`;}
  }
  if(S.modal==="detalle"){content=renderDetalle();}

  return`<div class="modal-bg" id="mbg" onclick="if(event.target.id==='mbg')closeModal()">
    <div class="modal-inner">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button onclick="closeModal()" style="background:none;border:none;color:${C.mut};font-size:22px">&#x2715;</button></div>
      ${content}
    </div>
  </div>`;
}

// ── RENDER PRINCIPAL ──────────────────────────────────────────────────────
function render(){
  if(!LOGIN.activo){renderLogin();return;}
  let main="";
  const t=S.tab;
  if(t==="r")main=isRep()?renderRankingReps():renderReporte();
  else if(t==="c")main=renderCalendario();
  else if(t==="v")main=renderVentas();
  else if(t==="e"&&!isRep())main=renderEquipo();
  else if(t==="z"&&!isRep())main=renderZonas();
  else if(t==="l")main=renderLinea();
  else if(t==="m")main=renderMVPs();
  else if(t==="p")main=renderPerfil();
  document.getElementById("app").innerHTML=renderHeader()+main+renderTabs()+renderModal();
}

function renderRankingReps(){
  const mo=hoy.getMonth(),yr=hoy.getFullYear();
  const vm=filtMes(ventas,mo,yr),va=filtAnio(ventas,yr);
  const reps=users.filter(u=>u.rol==="Vendedor"&&u.activo);
  const tabla=(arr,titulo)=>{
    const l=[...reps].map(u=>({...u,vol:volNetoU(arr,u.id,"rep_id"),vtas:arr.filter(v=>v.rep_id===u.id&&!v.cancelado&&v.tipo!=="Cancelacion").length})).sort((a,b)=>b.vol-a.vol);
    return card(`<div style="font-size:10px;color:${C.mut};font-weight:800;margin-bottom:10px">${titulo}</div>
      ${l.map((u,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;background:${u.id===cu().id?C.acc+"11":"transparent"};border-radius:8px;padding:${u.id===cu().id?"6px 8px":"0"}">
        <span style="font-weight:900;color:${i===0?C.gold:C.mut};width:22px">#${i+1}</span>
        ${av(u,30)}
        <div style="flex:1"><div style="font-size:12px;font-weight:800;color:${u.id===cu().id?C.acc:C.txt}">${u.n}${u.id===cu().id?" (Tu)":""}</div>${bar(u.vol,l[0]?.vol||1,i===0?C.gold:C.acc)}</div>
        <div style="font-size:12px;font-weight:900;color:${i===0?C.gold:C.acc}">${FMTK(u.vol)}</div>
      </div>`).join("")}`);
  };
  return`<div style="padding:14px">
    <div style="font-size:17px;font-weight:900;margin-bottom:12px">Ranking Reps</div>
    ${tabla(vm,"MES — "+MESES[mo].toUpperCase())}
    ${tabla(va,"AÑO "+hoy.getFullYear())}
  </div>`;
}

  const fFmt=(dr.fecha||td).split("-").reverse().join(" / ");
  let txt="*SECRETS MIRABEL -- REPORTE DEL DIA*\n"+fFmt+"\n========================\n";
  txt+="Q's: "+dr.qs+"\nVol: "+FMT(+(dr.vol||0))+"\nVPG: "+FMT(+(dr.vpg||0))+"\n";

  if(vDia.length===0)txt+="Sin ventas\n";
  if(cxlDia.length>0){txt+="\nCANCELACIONES:\n";cxlDia.forEach(v=>{txt+=FMT(v.vol)+" | "+v.cliente+"\n";});}
  if(dr.pend)txt+="\nVENTA PENDIENTE:\n"+dr.pend+"\n";
  txt+="========================\n*LOCACION*\n";
  Object.entries(zonas).forEach(([zona,zdata])=>{

          if(!zonaHasData){zonaLines.push(zona.toUpperCase()+":\n");zonaHasData=true;}
          zonaLines.push("  "+loc+": "+(v.qs||0)+" Q's | "+(v.vol?FMT(+v.vol):"$0")+"\n");

    });
    zonaLines.forEach(l=>{txt+=l;});
  });
  S.locsExtra.forEach(loc=>{const v=dr.ld&&dr.ld[loc];if(v&&(v.qs||v.vol))txt+="Extra - "+loc+": "+(v.qs||0)+" Q's | "+(v.vol?FMT(+v.vol):"$0")+"\n";});
  // Linea del dia — quien trabaja hoy
  const trabajando=users.filter(u=>u.activo&&trabajaHoy(u,td));

      txt+=`POWER — VENDIERON AYER
`;
      L.vendieron.forEach(u=>{txt+=`  ${pos}. ${u.n.toUpperCase()} $${volAyerCerr(u.id).toLocaleString("es-MX")}
`;pos++;});
      txt+=`
`;
    }
    if(L.rotacion.length>0){
      txt+=`ROTACION POR VOLUMEN
`;
      L.rotacion.forEach(u=>{const v=volAgMesCerr(u.id);txt+=`  ${pos}. ${u.n.toUpperCase()}${v>0?" — $"+v.toLocaleString("es-MX"):""}
`;pos++;});
      txt+=`
`;
    }
    if(L.descansoHoy.length>0){
      txt+=`DESCANSO HOY
`;
      L.descansoHoy.forEach(u=>{const sd=statusDia(u,hoyStr);txt+=`  • ${u.n.toUpperCase()} — ${sd.status.toUpperCase()}
`;});
    }
  }
  return txt;
}

window.enviarLineaWA=(tipo)=>{
  const txt=generarTextoLinea(tipo);
  const num=(S.waNum||"").replace(/[^0-9]/g,"");
  if(!num){alert("Ingresa un numero de WhatsApp primero");return;}
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(txt),"_blank");
};

// ── ACCIONES LINEA ────────────────────────────────────────────────────────
window.marcarPareja=(uid,tomo)=>{
  const ayer=getAyer();
  if(!lineaData[ayer])lineaData[ayer]={};
  if(!lineaData[ayer][uid])lineaData[ayer][uid]={};
  lineaData[ayer][uid].tomoPareja=tomo;
  // Tambien registrar si vendio (volumen de ayer)
  const volAyer=ventas
    .filter(v=>v.fecha===ayer&&v.rep_id===uid&&v.tipo==="Agencia"&&!v.cancelado)
    .reduce((a,v)=>a+v.vol,0);
  lineaData[ayer][uid].vendioVol=volAyer;
  saveRender();
};

// ── ACCIONES ZONAS ────────────────────────────────────────────────────────
window.agregarHotel=zona=>{
  const nombre=prompt("Nombre del nuevo hotel:");
  if(!nombre||!nombre.trim())return;
  const n=nombre.trim();
  if(!zonas[zona])return;
  if(!zonas[zona].hoteles)zonas[zona].hoteles=[];
  if(zonas[zona].hoteles.includes(n)){alert("Ese hotel ya existe en esta zona.");return;}
  zonas[zona].hoteles.push(n);
  if(!zonas[zona].locs)zonas[zona].locs={};
  zonas[zona].locs[n]=[];
  saveRender();
};
window.quitarHotel=(zona,hotel)=>{
  if(!confirm("¿Quitar "+hotel+" de "+zona+"?"))return;
  if(!zonas[zona])return;
  zonas[zona].hoteles=(zonas[zona].hoteles||[]).filter(h=>h!==hotel);
  if(zonas[zona].locs)delete zonas[zona].locs[hotel];
  saveRender();
};
window.agregarLoc2=(zona,hotel,inputId)=>{
  const el=document.getElementById(inputId);
  if(!el)return;
  const loc=el.value.trim().toUpperCase();
  if(!loc){alert("Escribe el codigo de la locacion");return;}
  if(!zonas[zona]||!zonas[zona].locs)return;
  if(!zonas[zona].locs[hotel])zonas[zona].locs[hotel]=[];
  if(zonas[zona].locs[hotel].includes(loc)){alert("Esa locacion ya existe en este hotel.");return;}
  zonas[zona].locs[hotel].push(loc);
  el.value="";
  saveRender();
};
window.quitarLoc=(zona,hotel,loc)=>{
  if(!zonas[zona]||!zonas[zona].locs||!zonas[zona].locs[hotel])return;
  zonas[zona].locs[hotel]=zonas[zona].locs[hotel].filter(l=>l!==loc);
  saveRender();
};
window.agregarZona=()=>{
  const nombre=(document.getElementById("new_zona_name")||{}).value?.trim();
  if(!nombre){alert("Escribe el nombre de la zona");return;}
  if(zonas[nombre]){alert("Esa zona ya existe");return;}
  zonas[nombre]={hoteles:[],locs:{}};
  saveRender();
};

// ── PWA: Prompt para instalar en pantalla de inicio ────────────────────
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredPrompt=e;
  // Mostrar banner de instalacion despues de 3 segundos
  setTimeout(()=>{
    if(deferredPrompt&&!localStorage.getItem("pwa_installed")){
      mostrarBannerInstalar();
    }
  },3000);
});
window.addEventListener("appinstalled",()=>{
  localStorage.setItem("pwa_installed","1");
  const b=document.getElementById("pwa_banner");
  if(b)b.remove();
});

function mostrarBannerInstalar(){
  if(document.getElementById("pwa_banner"))return;
  const b=document.createElement("div");
  b.id="pwa_banner";
  b.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:440px;background:#0d1526;border:1px solid #00e5b8;border-radius:14px;padding:12px 14px;z-index:999;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,229,184,.2)";
  b.innerHTML=`
    <div style="font-size:28px">📲</div>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:900;color:#00e5b8">Instalar como App</div>
      <div style="font-size:11px;color:#7a90b8;margin-top:2px">Agrega Sales Report a tu pantalla de inicio</div>
    </div>
    <div style="display:flex;gap:6px">
      <button onclick="document.getElementById('pwa_banner').remove();localStorage.setItem('pwa_installed','skip')" style="background:transparent;border:1px solid #1a2d4a;border-radius:8px;padding:6px 10px;color:#7a90b8;font-size:11px;font-weight:800">Ahora no</button>
      <button onclick="instalarPWA()" style="background:#00e5b8;border:none;border-radius:8px;padding:6px 12px;color:#070b14;font-size:11px;font-weight:900">Instalar</button>
    </div>`;
  document.body.appendChild(b);
}

window.instalarPWA=async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==="accepted"){localStorage.setItem("pwa_installed","1");}
    deferredPrompt=null;
    const b=document.getElementById("pwa_banner");
    if(b)b.remove();
  }
};
</script>
